# Fluxa 完整主配置示例。作者：可莉唯一的狗。
# 用户编辑本文件；Rust 合并后写入 runtime-rules.bin，直接查询已编译的二进制平铺索引。
# 四类规则类型仅接受大写；远程规则使用 Clash classical 的 payload 列表。
# 已实现 VLESS TCP REALITY Vision 出站；TUN 转发、网关和其他协议仍明确拒绝。
schema-version: 1
kind: configuration
name: 我的 Fluxa

# 可选 MMDB 下载地址，仅使用用户显式配置；无默认来源。
# 缺失时 WARN + Disabled 2410，无法查询归属地；配置后需显式 geoip_refresh 下载。
geoip_url: null # 不启用 GeoIP；启用时改为下面明确的 URL。
# geoip_url: https://ssss.aa.com # 示例占位地址，请换成自己的原始 .mmdb HTTPS 地址。

# 节点 URI 含凭据，请使用自己的节点；当前示例不提供可用账号。
# VLESS URI 必须指定 security=reality、flow=xtls-rprx-vision、sni、pbk、sid。
# fp 支持 chrome/chrome133、chrome131、chrome120、firefox/firefox120、safari/safari16、ios/ios14、
# android/android-chrome133、android-chrome120、edge/edge106、random 与原生 fluxa。默认 chrome133 模板。
# 名称对应固定版本握手模板，random 在已支持模板中选择；未知指纹明确拒绝。
# nodes 保留现有 name/uri 格式；客户端传递给内核的是稳定 id 与完整 uri。
# 配置命令 network_configure 新增 outbounds: [{id: <稳定标识>, uri: <完整VLESS链接>}]
# outbounds 默认 []，最多 128 条；routing.outbound 必须引用对应 id。重复 id 和不支持的组合拒绝整次更新。
# 出站支持 TCP 与单目标 XUDP；XUDP 空报文和超过 7526 字节的报文明拒，任意 Mux 未实现，不回退直连。
nodes: []

# 订阅原始内容分别保留。enabled 仅控制自动更新及规则是否参与。
subscriptions:
  - id: daily-rules
    name: 每日远程规则
    url: https://example.com/fluxa/rules.yaml
    kind: rules
    policy: proxy # 订阅条目不写动作；由此字段统一指定 direct、proxy 或 reject。
    # outbound: my-node # 仅 proxy 可指定；省略时在生成规则快照时继承主配置出站。
    enabled: false # 示例地址为占位符；换成自己的真实地址后启用。
    # 每天 UTC 12:00；必须使用带引号的 HH:mm，不使用设备本地时区。
    # 休眠、退出或断网错过时，恢复后仅补最近到期的一次，不逐天补跑。
    # 失败保留旧内容，自动重试至少间隔 60 秒；恢复后只补最近一次，也允许手动重试。
    update-time: "12:00"
  - id: manual-rules
    name: 仅手动远程规则
    url: https://example.com/fluxa/manual-rules.yaml
    kind: rules
    policy: proxy # 订阅条目不写动作；由此字段统一指定 direct、proxy 或 reject。
    # outbound: my-node # 仅 proxy 可指定；省略时在生成规则快照时继承主配置出站。
    enabled: false
    # 不设置 update-time 就不自动更新。单项更新及更新全部均为手动操作。
    # 旧 update-interval-hours 已移除；不要再填写该字段。

# 域名目标先查询域名规则；域名命中后跳过 IP 规则，包含 IP 拦截。
# 没有域名命中时才解析真实 IP 并匹配 IP-CIDR。数字 IP 直接进入 IP 阶段。
# 域名阶段：拦截最先，然后 DOMAIN、DOMAIN-SUFFIX、DOMAIN-KEYWORD。
# IP 阶段：拦截最先，然后普通 IP-CIDR。相同类别本地优先于远程。
# 同来源同类型保留原始顺序；只有证明完全无效的非拦截规则可裁剪。
# 普通端口/传输规则仅在域名/IP 普通规则未命中时参与；有效拦截仍优先。
# 全域 transport 规则只允许 reject，direct/proxy 是非法配置；UDP 不等同 QUIC；quic 按 v1/v2 报文与连接内关联识别，独立短头和迁移有识别边界。
# 临时调试规则禁止在本文件声明，只通过本地 API 操作；每条有效期 1–3600 秒。
# 如需拦截 QUIC，添加：{type: transport, value: quic, policy: reject}
# tcp/udp 使用相同形式；udp 拦截包含 QUIC，quic 不拦截普通 UDP。
rules:
  - type: DOMAIN
    value: ads.example.com
    policy: reject
  - type: DOMAIN
    value: api.example.com
    policy: direct
  - type: DOMAIN-SUFFIX
    value: example.com # 包含域名本身和各级子域，不匹配 badexample.com。
    policy: direct
  - type: DOMAIN-KEYWORD
    value: tracker # 只匹配域名中的关键词，不匹配 URL 路径。
    policy: reject
  - type: IP-CIDR
    value: 192.0.2.0/24
    policy: direct
  - type: IP-CIDR
    value: 2001:db8::/32
    policy: direct
  - type: destination-port
    value: "25" # 端口及端口范围仍保留既有顺序语义。
    policy: reject
  - type: transport
    value: quic # 可替换为 tcp 或 udp；udp 拦截包含 QUIC。
    policy: reject

# 默认策略在没有适用规则时生效；缺失或无效代理出站明确失败，不回退直连。
routing:
  mode: rules
  fallback: direct
  # 选择代理时可指定 outbound 标识；本示例没有配置实际代理出站。

# 连接上限和空闲回收由 Rust 执行，旧连接保留创建时的快照。
outbound-limits:
  maximum-connections: 64
  idle-timeout-ms: 60000

# 手动 DNS 上游。加密上游不能与 UDP/TCP 上游混用，最多八个服务器。
# DoH 的 bootstrap 是数字地址，避免查询 DoH 域名产生自举循环。
dns:
  servers:
    - transport: doh
      url: https://cloudflare-dns.com/dns-query
      bootstrap: "1.1.1.1:443"
    # 其他写法（切换时替换上面的服务器，不与不同传输类别混用）：
    # - transport: dot
    #   address: "1.1.1.1:853"
    #   server-name: cloudflare-dns.com
    # - transport: udp
    #   address: "1.1.1.1:53"
    # - transport: tcp
    #   address: "1.1.1.1:53"
  timeout-ms: 5000
  dnssec: false # 设为 true 启用 DNSSEC 验证；验证失败不静默放行。
  fake-ip:
    ipv4-range: 198.18.0.0/16
    ipv6-range: fd00:198:18::/64
    capacity: 4096
    exclude: []
  # 仅配置监听参数；必须由用户显式启动 DNS 服务才绑定端口。
  service:
    listen: "127.0.0.1:1053"
    allow-lan: false
    allowed-clients: []

# HTTPS 解密需用户明确启用、导出并在系统中信任公开 CA；私钥不放入配置。
mitm:
  enabled: false
  hosts: [] # 启用后填写精确域名，不自动对全部站点解密。

# 主配置仅展示改写列表；插件专属 ui、browser-scripts 需使用 kind: plugin。
# 示例不包含任意远程 JS、节点凭据或 CA 私钥。
rewrites: []

# TUN UDP 第一阶段通过宿主二进制接口测试，不创建系统隧道；本配置不新增启用开关。
# TCP 转发、TCP DNS 入口和分片尚未完成，不支持的流量明确拒绝。

# TUN DNS/Fake-IP v2.2.0：上游与合成池使用上面的 dns 配置。
# 宿主打开 UDP 会话时可选 dns_endpoints（默认 []，最多两个数字地址端口，端口必须 53）。
# 示例调用：tun_udp_open {mtu: 1500, maximum_flows: 16, output_capacity: 32,
# timeout_ms: 3000, idle_timeout_ms: 30000, dns_endpoints: ["198.19.0.53:53", "[fd00:198:19::53]:53"]}
# 此处是会话 API 示例，不是主配置启用开关；禁止把 dns_endpoints 写为主配置字段。
# 端点不可落入 Fake-IP 池；不接管其他地址的 DNS，不修改系统 DNS 或创建隧道。
# 配置解析器更换后必须重开会话，禁止将旧合成地址按新解析器的代次恢复。
# v2.2.1：普通历史映射也计入高水位；TUN 接管后同范围普通分配共用游标，最多保留 16 个已使用池；耗尽拒绝，不回绕。
