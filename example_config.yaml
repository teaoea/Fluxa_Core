# 完整主配置示例

# 配置文件存放到：App Group Container/config
# 打开App会检查目录，是否有配置文件，如果不存在配置文件
# 生成一份全量配置文件config.yaml（不含proxies、proxy-groups）
# 对配置文件每个字段加上注释，注释采用设备语言，符号使用设备语言对应符号
# App 通过系统 API 获取真实 App Group Container 并授权只读文件；Core 不推断目录，不向回复暴露内部路径
# 默认配置模板由 Core 返回纯内容；App 检查并自行创建、保存配置文件
# Network Extension只能读取配置文件，不能写入配置文件

# 配置文件头注释
# 项目地址
# GitHub：https://github.com/teaoea/Nodus-Core
# 问题反馈地址，反馈问题是需提交日志
# Issues：https://github.com/teaoea/Nodus-Core/issues

# 日志处理，Core 仅负责使用公钥加密日志并输出加密数据流，不负责日志存储、解密及密钥管理
# silent：不记录日志
# info：记录完整日志，含debug、warn、error
# debug：仅记录调试日志
# warn：仅记录警告日志
# error：仅记录错误日志
# 加密算法：HPKE-P256-HKDF-SHA256-AES256GCM（固定算法，不支持自定义）
log:
  encryption: true # 是否启用日志加密：true：启用，false：禁用，默认为false
  public-key: "BASE64_PUBLIC_KEY" # 日志加密公钥，使用 Base64 编码的 P-256 公钥（X9.63 非压缩格式），启用加密时必填
  level: silent # 日记记录等级，默认为silent，不记录日志

system-proxy:
  # 系统代理监听端口，默认0，表示禁用系统代理，http/https/socks5共用同一端口
  # 禁止使用1–1053在内的端口，禁止使用与局域网共享相同端口
  port: 0
  # 需要绕过的地址
  bypass:
    ["127.0.0.1", "192.168.0.0/16", "10.0.0.0/8", "localhost", "*.local", "::1"]

lan-share:
  # 局域网共享监听端口，默认0，表示禁用局域网共享，禁止使用1–1053在内的端口，禁止使用系统代理端口
  port: 0
  # 局域网http/https/socks5访问用户和密码,默认为空
  account: ""
  password: ""

# 运行模式，默认 rule（规则模式），可选值：rule、global、direct
# rule：规则模式，按规则匹配，未命中时使用 final配置的策略
# global：忽略普通正式规则，保留特殊 REJECT，其他流量使用 final 策略
# direct：忽略普通正式规则，保留特殊 REJECT，其他流量直连
# debug 临时规则独立于运行模式，在所有模式下均可生效
mode: rule

# GeoIP配置
# App／宿主下载并校验成功后保存到约定目录中的 geoip.mmdb；规则集保存为 <name>.yaml。
# MaxMind GeoLite2 Country MMDB
# https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-Country.mmdb
# 中国增强版 GeoIP
# https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
# # 存放位置：App Group Container/rule/
geoip:
  enabled: false # false：禁用GeoIP；true：启用GeoIP，每次软件重新启动时或者到了更新时间会下载mmdb
  #url: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-Country.mmdb" # 如需配置GeoIP，建议使用这个mmdb数据库
  url: "https://example.com" # 示例占位地址，请换成自己的原始 .mmdb HTTPS 地址。
  update-time: "00:00" # 每天00:00更新；必须使用带引号的 HH:mm，使用设备本地时区

# IP出站策略，默认prefer-ipv4
# 无法使用：首选地址族无可用记录、无网络路由、连接失败或超时
# dns返回NXDOMAIN、DNSSEC验证失败或命中拦截策略，不触发地址族回退
# 同一地址族返回多个地址时，某个IP被规则拦截，只排除该IP，继续评估并尝试其他地址
# prefer-ipv4：优先查询A记录并尝试IPv4，无法使用时才查询AAAA记录并尝试IPv6
# prefer-ipv6：优先查询AAAA记录并尝试IPv6，无法使用时才查询A记录并尝试IPv4
# only-ipv4：仅使用IPv4，主动解析时不查询AAAA记录，不允许回退
# only-ipv6：仅使用IPv6，主动解析时不查询A记录，不允许回退
ip-strategy: prefer-ipv6

# 支持的代理协议示例配置
proxies:
  # VLESS+Reality+xtls-rprx-vision
  - name: PROXY # 节点名称
    type: vless # 协议
    server: example.com # 地址，支持域名和IP地址
    port: 443 # 端口
    uuid: 00000000-0000-0000-0000-000000000000
    flow: xtls-rprx-vision # 流控
    security: reality
    sni: example.com
    pbk: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE # 仅用于格式验证的虚构公钥，连接前必须替换
    sid: "01" # 格式示例，连接前替换为服务端真实 short id
    fp: chrome133 # 指纹模板，支持 chrome/chrome133、chrome131、chrome120、firefox/firefox120、safari/safari16、ios/ios14、android/android-chrome133、android-chrome120、edge/edge106、random 与原生 nodus。默认 chrome133 模板


  # 自动连接重试候选；地址与密钥均为格式示例，使用前分别替换。
  - name: 节点1 # 第一候选节点
    type: vless # 协议
    server: first.example.com # 地址，支持域名和IP地址
    port: 443 # 端口
    uuid: 00000000-0000-0000-0000-000000000000
    flow: xtls-rprx-vision # 流控
    security: reality
    sni: example.com
    pbk: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE # 仅用于格式验证的虚构公钥，连接前必须替换
    sid: "01" # 格式示例，连接前替换为服务端真实 short id
    fp: chrome133 # 指纹模板，支持 chrome/chrome133、chrome131、chrome120、firefox/firefox120、safari/safari16、ios/ios14、android/android-chrome133、android-chrome120、edge/edge106、random 与原生 nodus。默认 chrome133 模板

  - name: 节点2 # 第二候选节点
    type: vless # 协议
    server: second.example.com # 地址，支持域名和IP地址
    port: 443 # 端口
    uuid: 00000000-0000-0000-0000-000000000000
    flow: xtls-rprx-vision # 流控
    security: reality
    sni: example.com
    pbk: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE # 仅用于格式验证的虚构公钥，连接前必须替换
    sid: "01" # 格式示例，连接前替换为服务端真实 short id
    fp: chrome133 # 指纹模板，支持 chrome/chrome133、chrome131、chrome120、firefox/firefox120、safari/safari16、ios/ios14、android/android-chrome133、android-chrome120、edge/edge106、random 与原生 nodus。默认 chrome133 模板

# 策略组
proxy-groups: []

# 远程插件
# 存放位置：App Group Container/plugin/id
# 每个插件都有唯一的id，插件通过id进行优先级处理，不得将插件名称作为id，id采用数字自增就行，禁止目录重复
# 每次导入新插件，都是最后一个目录的数字+1，例如：1、2、3、4
# 插件引入的js，存放到App Group Container/plugin/id/目录内
# 插件调整位置，例如1变成2、2变成1，同步调整id，以及文件存放路径
# 插件内复写规则引入的js，例如request.js，实际路径是App Group Container/plugin/（id）/request.js
# 每次编译配置文件需要将复写规则引入的js脚本的绝对路径编译进去，但是不得将js脚本内容一并编译进去，js脚本只能在需要时按需加载
# js 脚本按需加载并缓存；生命周期由复写规则 js-ttl 声明，单位秒，省略默认 3600；不读取 JS 头注释中的 TTL，缓存可以手动清除
# js需要线程隔离，清除缓存时同步移除对应线程，手动清理缓存，即是js对应线程正在执行，也需要移除，自动清理缓存，需要等线程执行完毕才能移除，同时标记待移除，不在接受新任务
plugin-providers:
  - name: 插件集名称 #
    category: 插件集分类
    url: https://example.com/nodus/plugins.yaml # 插件集订阅地址
    enabled: false # 插件集是否启用，false 不启用，true 启用
    update-time: "12:00" #插件集每日更新的时间，必须使用带引号的 HH:mm，使用设备本地时区。省略此字段则不自动更新，仅在第一次导入时更新一次

# 远程规则集
# 正文格式为 rules: ["domain,example.com", "protocol,quic,example.com"]，类型小写，不携带策略。
# YAML 结构错误拒绝整个更新；自带策略或不合法的行单独忽略。
# App／宿主将订阅规则集下载下来，保存到约定位置
# 存放位置：App Group Container/rule/
# App／宿主在每天指定时间更新订阅规则集，自动更新与手动更新会覆盖旧规则集文件，未配置update-time字段则不自动更新，仅在第一次导入时下载
# 规则集更新或者本地规则变动，会进行合并裁剪，写入到内存，如果本地规则变动，但是订阅规则还未到更新时间
# 订阅规则不会更新，而是直接使用rules文件夹下被激活的规则集文件
# 订阅规则集配置policy: reject时，仅允许domain、ip-cidr、protocol、port规则执行拦截
# domain-suffix、domain-keyword 规则直接忽略，不参与匹配，防止扩大拦截范围
# 忽略不符合要求的规则，不影响同一订阅中其他合法规则的加载
rule-providers:
  - name: direct # 指定规则集名称，禁止重复，必填
    url: https://example.com/nodus/direct.yaml # 规则集订阅地址，必填
    policy: direct # 规则集内的规则流量处理策略，可选值：[direct、reject、代理节点名称]，必填项
    enable: false # 规则集是否启用，false 不启用，true 启用，默认true
    update-time: "12:00" # 规则集每日更新的时间，必须使用带引号的 HH:mm，使用设备本地时区

  - name: reject
    url: https://example.com/nodus/reject.yaml
    policy: reject
    enable: true

  - name: proxy
    url: https://example.com/nodus/proxy.yaml
    policy: 节点1,节点2 # 自动连接重试：只在到节点1建连失败/超时时尝试节点2；接收方错误或业务数据发送后不重试

# 网络流量处理包含：direct（直连）、reject（拦截）、节点名称
# 域名目标先查询域名规则，域名命中后跳过IP规则，命中final不被视为命中域名规则
# 没有域名命中时才解析真实IP并匹配ip-cidr，数字IP直接进入IP阶段
# 来源优先级：本地规则->插件规则->远程规则
# 规则优先级：process-name->protocol->port->domain->domain-suffix->domain-keyword->ip-cidr->final
# 拦截规则不区分来源，优先适用：domain，ip-cidr，protocol，port
# debug临时规则永远处于第一优先，多条debug临时规则，按照规则优先级处理
# 同一来源命中多条，按照规则优先级处理
# process-name仅适用于macOS，iOS、iPadOS、tvOS默认忽略
# 无法确定连接所属进程时，跳过process-name，继续匹配其他规则
# 远程订阅规则集，默认忽略process-name
# port、protocol 中的域名参数采用domain-suffix语义，匹配域名本身及各级子域名，并要求端口或协议同时符合
# geoip视为ip-cidr处理 (显式ip-cidr优先于geoip)，未配置有效geoip.url时默认忽略geoip规则并返回warn
rules:
  - domain-suffix,example.com,direct # 针对 example.com 及其所有子域名的流量走直连
  - domain,ads.example.com,reject # 针对精确域名 ads.example.com 的流量拦截
  - domain-keyword,example,reject # 只匹配 PSL 可注册域名的租户标签；com.cn/co.uk 及私有 github.io 均为后缀，例如 foo.github.io 只检查 foo
  - ip-cidr,192.0.2.0/24,direct # 针对指定IP段走直连
  - ip-cidr,2001:db8::/32,direct # 针对指定IP段走直连
  - port,80,direct # 所有80端口流量走直连
  - port,25,reject # 拦截全部25端口流量
  - port,53,example.com,direct # example.com的53端口走直连，
  - protocol,quic,reject # 拦截所有QUIC流量
  - protocol,tcp,example.com,direct # 针对example.com的TCP流量走直连
  - process-name,WeChat,direct # WeChat进程直连
  - geoip,CN,direct # 中国大陆IP走直连
  - final,(PROXY,reject) # 兜底规则，支持direct、reject、代理节点名称；兜底规则必须放在最后一条，不允许为空，且只能存在一条

# dns示例配置
dns:
  enable: true # false：禁用配置的dns，采用系统默认dns，默认false
  # 此地址仅解析 DoH/DoT 上游域名及这些 DNS 使用的节点域名；不解析业务域名。未配置时仅上述引导允许系统 DNS。
  # 每次启动时，bootstrap会解析server列表内全部doh和dot，并将结果缓存到内存之中
  # 显式引导结果遵循 TTL（0 不缓存）；系统引导无法取得 TTL 时使用 3600 秒，过期重新查询
  bootstrap:
    - 1.1.1.1
  # server列表按照顺序解析，timeout为每个dns的独立期限
  # 只有显式设置system才使用系统dns，不会在server配置的dns都超时之后，自动回退到系统dns
  # 在server配置的所有dns都超时的情况下，按照错误流程处理
  server:
    # doh地址及网络模式，默认direct，可以设置为节点名称，dns出站策略不受rules规则限制
    # 例如doh设置（https://doh.pub/dns-query），即使rules配置（doh.pub）走代理，dns出站也是走直连
    - https://doh.pub/dns-query,direct
    - 2400:3200::1,PROXY
    - system # 系统dns
  timeout: 3 # dns查询超时，默认单位“秒”，可选范围 1–30 秒，超过范围会被自动修正为默认值 3 秒。
  dnssec: false # 设为 true 启用 DNSSEC 验证；验证失败不静默放行。
  # fake-ip 软件内部根据子网大小与内存预算固定分配最优容量
  fake-ip:
    enable: false # true，开启fake-ip，false，不开启fake-ip，默认为false，
    ipv4-range: 198.18.0.0/16
    ipv6-range: fd00:198:18::/64
    bypass: ["*.local", "*.lan", "time.apple.com", "*.push.apple.com"]

  # 将域名映射到指定的 IP 地址，优先于 DNS 解析。仅支持 IPv4 和 IPv6，禁止使用域名作为映射值。
  hosts: { "example.com": "192.168.1.1" }

# tun模式示例配置
tun:
  enable: false # true：启用tun模式；false：禁用tun模式
  name: utun # tun模式的虚拟网卡名称，支持字母、数字、下划线和中划线，不能以数字开头，Apple全平台不支持自定义虚拟网卡名称，默认忽略此选项
  mtu: 1500 # tun模式的最大传输单元
  # 绕过的地址，TUN模式不接管bypass配置的地址
  bypass: ["192.168.0.0/16", "10.0.0.0/8", "100.64.0.0/10"]

# HTTPS 解密需用户明确启用、导出并在系统中信任公开 CA；私钥不放入配置。
mitm:
  enabled: false
  skip-server-cert-verify: false
  capture-body: true # 是否捕获 HTTP/HTTPS 请求与响应正文
  # hosts
  # 针对域名进行解密，如果hosts配置和bypass有冲突，优先适用bypass
  # 使用通配符，例如*.chatgpt.com，会解密chatgpt.com，a.chatgpt.com
  # 未使用通配符，例如wechat.com，只会解密wechat.com，不会解密a.wechat.com
  # 如果输入*、*.com等，属于无效条目，默认忽略，且不会对任何域名进行解密，全局解密为调试功能，禁止通过配置实现相同功能
  hosts:
    - "*.chatgpt.com"
    - "wechat.com"
  # bypass
  # 开启全局解密之后，会忽略hosts，但是不会对bypass配置的域名进行解密，防止配置了SSL Pinning应用无法正常使用
  # 优先级顺序：bypass -> 全局解密 -> hosts
  # 使用通配符，例如*.chatgpt.com，会绕过chatgpt.com，a.chatgpt.com
  # 未使用通配符，例如wechat.com，只会绕过wechat.com，不会绕过a.wechat.com
  # 如果输入*、*.com等，属于无效条目，默认忽略，不会绕过任何域名
  bypass:
    - "*.chatgpt.com"
    - "wechat.com"

# 复写模块
# 规则示例
# A：https://example.com/api/* reject(404)
# B：https://example.com/api/** reject(404)
# *  匹配恰好一个非空路径段，不跨越 /
# ** 匹配零个或多个路径段，允许跨越 /
# A可以匹配https://example.com/api/a，但是不能匹配https://example.com/api/aa/a
# B可以匹配https://example.com/api/a，也可以匹配https://example.com/api/aa/a
# URL 匹配默认区分大小写，默认采用完整路径匹配，不进行模糊匹配，不自动扩展通配符的匹配范围
# Core 应当在加载规则时完成编译，简单匹配优先使用字符串比较
# 通配符匹配不得依赖正则表达式引擎，所有优化必须保持原始匹配语义
# 复写规则的优先级高于rules规则，本地复写规则优先于插件内的复写规则
# 用户手动编写的js脚本的默认存放在App Group Container/js目录
# 用户自行在配置文件内编写的复写规则，只能引用App Group Container/js目录内的js脚本
# action支持：⬇️
# reject：拦截，处理阶段request/response
# respond：直接构造自定义 HTTP 响应，处理阶段request
# modify-request：修改 HTTP 请求内容，处理阶段request
# modify-response：修改服务器返回的 HTTP 响应，处理阶段response
# redirect：返回 HTTP 3xx 重定向响应，处理阶段request
# script：通过 JS 动态处理请求或响应，处理阶段request/response
# abort：中断连接，不构造 HTTP 响应，request
# direct：直连，优先级低于临时调试规则，但是高于其他任何规则
# proxy 或 proxy(节点名称)：均合法；proxy 未指定节点时忽略，proxy(节点名称) 使用前端填入的已配置节点，失败不回退直连；优先级低于临时调试规则，高于其他规则
rewrites:
  # ==================== 请求条件拦截 ====================

  - url: https://example.com/api/* # URL 匹配表达式，* 仅匹配一个非空路径段
    enable: true # 是否启用，默认true（启用）
    phase: request # 执行阶段：request 为请求阶段
    when: # 附加匹配条件，所有条件默认使用 AND 逻辑
      method: GET # HTTP 请求方法，区分 GET、POST、PUT 等
      request-headers: # HTTP 请求头匹配条件
        exists: # 要求存在的请求头字段
          - User-Agent # 请求必须包含 User-Agent
          - X-Client-ID # 请求必须包含 X-Client-ID
        equals: # 请求头字段必须满足指定值
          X-Client-Type: mobile # X-Client-Type 必须等于 mobile
      query: # URL 查询参数匹配条件
        exists: # 要求存在的查询参数
          - ad_id # 查询参数必须包含 ad_id
        equals: # 查询参数必须满足指定值
          source: app # source 参数必须等于 app
    action: reject # 执行动作：拒绝请求
    status: 404 # 返回 HTTP 404 状态码

  # ==================== 响应条件拦截 ====================

  - url: https://example.com/images/** # ** 匹配零个或多个路径段
    phase: response # 执行阶段：response 为响应阶段
    when: # 原始 HTTP 响应必须满足以下条件
      status: 200 # 原始响应状态码必须为 200
      response-headers: # HTTP 响应头匹配条件
        exists: # 要求存在的响应头字段
          - Content-Type # 响应必须包含 Content-Type
        equals: # 响应头字段值匹配
          X-Resource-Type: image # 指定响应头必须等于 image
      content-type: image/png # 响应媒体类型必须为 PNG 图片
      content-length: # 原始响应体长度匹配条件
        min: 1 # 最小长度，单位为字节
        max: 1048576 # 最大长度，单位为字节，此处为 1 MiB
    action: modify-response # 修改原始 HTTP 响应
    response: # 新的响应内容
      status: 200 # 修改后的 HTTP 状态码
      body: # 修改后的响应体
        preset: transparent-png # 使用 Core 内置的 1×1 透明 PNG

  # ==================== 视频响应替换 ====================

  - url: https://example.com/video/** # 匹配指定路径下所有层级
    phase: request # 在请求阶段直接处理，无须等待服务器响应
    when: # 请求匹配条件
      method: GET # 仅处理 GET 请求
    action: respond # 由 Core 直接构造 HTTP 响应
    response: # 自定义 HTTP 响应
      status: 200 # 返回 HTTP 200
      body: # 自定义响应体
        preset: minimal-mp4 # 使用内置 0 毫秒、无音频 MP4 诱骗视频，用于去广告；实际播放器是否跳过广告需验证

  # ==================== 请求头修改 ====================

  - url: https://example.com/api/data # 精确 URL 匹配
    phase: request # 请求阶段
    when: # 请求匹配条件
      method: POST # 仅匹配 POST 请求
    action: modify-request # 修改原始 HTTP 请求
    request: # 请求修改内容
      headers: # 请求头修改操作
        set: # 设置或覆盖请求头
          X-Custom-Header: Nodus # 设置自定义请求头
        remove: # 删除指定请求头
          - X-Tracking-ID # 删除 X-Tracking-ID

  # ==================== JavaScript 复杂处理 ====================

  - url: https://example.com/api/user/** # URL 匹配表达式
    phase: response # 响应阶段执行 JS
    when: # JS 执行前的原生匹配条件
      status: 200 # 仅处理 HTTP 200 响应
      content-type: application/json # 仅处理 JSON 响应
    action: script # 调用 JavaScript 引擎
    js: response # 精确引用 scripts.name，不要求 .js 后缀；编译时绑定宿主明确提供的只读绝对文件路径
    js-ttl: 3600 # 脚本缓存生命周期，单位秒，省略默认 3600；只允许用于 action: script

# js脚本引入
scripts:
  name: response # 必填资源名称，与 rewrites[].js 精确一致，不从 URL 推导名称
  url: https://example.com/response.js # js文件路径
