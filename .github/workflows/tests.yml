name: 测试与报告契约
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: fluxa-tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  rust:
    runs-on: macos-15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FLUXA_TEST_EVIDENCE_DIR: /tmp/fluxa-test-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装固定 Rust 与检查组件
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          cargo fetch --locked
      - name: 核验布局与静态正确性
        run: |
          python3 Tools/test_reports.py --check-layout
          cargo fmt --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: 验证报告工具的失败保全
        run: python3 Tools/test_reports.py --external test_test_reporting -- python3 tests/test_test_reporting.py
      - name: 验证不稳定附件发布控制流
        run: python3 Tools/test_reports.py --external test_dev_release -- python3 tests/test_dev_release.py
      - name: 真实 Rust 测试与逐文件报告
        run: python3 Tools/test_reports.py --run --evidence-dir "$FLUXA_TEST_EVIDENCE_DIR"
      - name: 核验错误协议
        run: cargo run --locked --example error_contract -- --check
      - name: 核验当前源码与报告一致
        run: python3 Tools/test_reports.py --check-reports
      - name: 无论成功或失败均保全原始证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxa-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/*.md
            /tmp/fluxa-test-evidence/
          if-no-files-found: error
  tcp-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FLUXA_TEST_EVIDENCE_DIR: /tmp/fluxa-linux-tcp-evidence
    steps:
      - uses: actions/checkout@v4
      - name: 固定 Rust 工具链
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          cargo fetch --locked
      - name: 验证有界 TCP 单元与资源契约
        run: python3 Tools/test_reports.py --run --evidence-dir "$FLUXA_TEST_EVIDENCE_DIR" --suite test_tun_tcp_buffer --suite test_tun_tcp_state --suite test_tun_tcp_wire --suite test_tun_tcp_session --suite test_tun_ip --suite test_tun_fragment --suite test_tun_udp --suite test_tun_icmp
      - name: 构建真实系统互通夹具并保留编译状态
        run: python3 Tools/test_reports.py --external test_tun_tcp_kernel --phase compile -- cargo build --locked --example tun_tcp_kernel
      - name: 独立网络命名空间真实 TCP 互通
        run: python3 Tools/test_reports.py --external test_tun_tcp_kernel -- sudo unshare --net python3 tests/test_tun_tcp_kernel.py "$PWD/target/debug/examples/tun_tcp_kernel"
      - name: 系统 UDP 重组验证出站分片
        run: python3 Tools/test_reports.py --external test_tun_fragment_kernel -- sudo unshare --net python3 tests/test_tun_fragment_kernel.py "$PWD/target/debug/examples/tun_tcp_kernel"
      - name: 保全 Linux 实际报告与失败证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxa-linux-tcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test_tun_tcp_*.md
            tests/test_tun_icmp.md
            tests/test_tun_ip.md
            tests/test_tun_fragment*.md
            tests/test_tun_udp.md
            /tmp/fluxa-linux-tcp-evidence/
          if-no-files-found: error

  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [rust, tcp-linux]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 安装固定构建工具链
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          cargo fetch --locked
      - name: 构建并发布本提交的不稳定测试附件
        env:
          GH_TOKEN: ${{ github.token }}
          FLUXA_DEV_SOURCE: ${{ github.sha }}
          FLUXA_DEV_REPOSITORY: ${{ github.repository }}
          FLUXA_DEV_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash Tools/dev-release.sh
