name: 发布内核二进制
on:
  push:
    branches: [dev]
    paths: [Release.version, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fluxa-core-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - name: 验证 Rust 与实际 Swift FFI
        run: |
          cargo fetch --locked
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          bash check-ffi.sh all
      - name: 构建静态框架并打包
        run: |
          bash build-macos.sh
          mkdir -p Release
          cargo build --locked --release --example https_fixture
          cp target/release/examples/https_fixture Release/fluxa-test-fixture
          cd Release
          zip fluxa-test-fixture-macos-arm64.zip fluxa-test-fixture
          rm fluxa-test-fixture
          cd ..
          ditto -c -k --keepParent Vendor/FluxaEngine.xcframework Release/FluxaEngine.xcframework.zip
          swift package compute-checksum Release/FluxaEngine.xcframework.zip > Release/checksum.txt
          shasum -a 256 Release/fluxa-test-fixture-macos-arm64.zip > Release/fixture-checksum.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          version = Path('Release.version').read_text().strip()
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version): raise SystemExit('版本格式无效')
          cargo_version = re.search(r'^version = "([^"]+)"', Path('Cargo.toml').read_text(), re.M).group(1)
          if version != cargo_version: raise SystemExit('发布版本与 Cargo 不一致')
          checksum = Path('Release/checksum.txt').read_text().strip()
          if not re.fullmatch(r'[0-9a-f]{64}', checksum): raise SystemExit('校验值无效')
          path = Path('Package.swift')
          source = path.read_text()
          source, count = re.subn(r'checksum: "[0-9a-f]{64}"', 'checksum: "'+checksum+'"', source)
          if count != 1: raise SystemExit('未找到唯一二进制校验值')
          path.write_text(source)
          PYCODE
      - name: 保存校验值与版本标签
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Package.swift
          version="$(cat Release.version)"
          git commit -m "发布 $version 内核二进制并固定下载校验值"
          git push origin HEAD:dev
          git tag "v$version"
          git push origin "v$version"
      - name: 发布下载附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat Release.version)"
          gh release create "v$version" Release/FluxaEngine.xcframework.zip Release/checksum.txt Release/fluxa-test-fixture-macos-arm64.zip Release/fixture-checksum.txt --verify-tag --title "libfluxa_core v$version" --notes 'macOS ARM64 静态内核；Rust 与实际 Swift FFI 已通过。Swift 包固定二进制下载 URL 与 SHA-256，不包含 iOS/tvOS 切片。'
      - name: 验证远程二进制下载和 Swift 门面
        run: swift test --disable-sandbox
