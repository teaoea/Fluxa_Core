name: 发布内核二进制
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fluxa-core-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      FLUXA_TEST_EVIDENCE_DIR: /tmp/fluxa-test-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 固定发布源码
        run: |
          # 补发二进制时与已经发布的 crate 保持同一源码；新功能版本不继承旧覆盖值。
          python3 - <<'PYCODE'
          import json, re, subprocess
          from pathlib import Path
          version = Path('Release.version').read_text().strip()
          path = Path('Release.source.json')
          if path.exists():
              record = json.loads(path.read_text())
              if set(record) != {'version', 'sourceCommit'}: raise SystemExit('发布源码记录字段无效')
              if record['version'] == version:
                  source = record['sourceCommit']
                  if not re.fullmatch(r'[0-9a-f]{40}', source): raise SystemExit('发布源码提交无效')
                  subprocess.run(['git', 'checkout', '--detach', source], check=True)
          if Path('Release.version').read_text().strip() != version: raise SystemExit('确定源码的发布版本不一致')
          PYCODE
          echo "FLUXA_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - name: 验证 Rust 内核
        run: |
          cargo fetch --locked
          cargo fmt --check
          cargo package --list --locked > /tmp/fluxa-package-files.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          files = set(Path('/tmp/fluxa-package-files.txt').read_text().splitlines())
          required = {'src/error.rs', 'tests/test_error_contract.rs', 'tests/test_fixture_geoip.rs', 'tests/test_service_pipeline.rs', 'tests/fixtures/error-contract-v1.json', 'tests/fixtures/error-contract-v2.json', 'tests/fixtures/error-contract-v2.4.1.json', 'Documentation/error-codes.json', 'Documentation/错误代码查询表.md'}
          if not required <= files: raise SystemExit('发布包缺少错误契约必要文件：'+str(required-files))
          PYCODE
          python3 Tools/test_reports.py --run --evidence-dir "/tmp/fluxa-test-evidence"
          python3 Tools/test_reports.py --check-reports
          cargo run --locked --example error_contract -- --check
          cargo run --locked --example fake_ip_reconfigure
          cargo run --locked --example geoip_configuration
          python3 Tools/test_reports.py --run --suite test_error_contract --evidence-dir "/tmp/fluxa-test-evidence"
          cargo clippy --locked --all-targets -- -D warnings
          python3 -m venv /tmp/fluxa-quic-peer
          /tmp/fluxa-quic-peer/bin/python -m pip install aioquic==1.2.0
          /tmp/fluxa-quic-peer/bin/python tests/test_fixture_quic_packet.py /tmp/fluxa-quic-initial.bin
      - name: 构建静态框架并打包
        run: |
          bash build-macos.sh
          mkdir -p Release
          cargo build --locked --release --example https_fixture
          cp target/release/examples/https_fixture Release/fluxa-test-fixture
          cd Release
          zip fluxa-test-fixture-macos-arm64.zip fluxa-test-fixture
          rm fluxa-test-fixture
          cd ..
          ditto -c -k --keepParent Vendor/FluxaEngine.xcframework Release/FluxaEngine.xcframework.zip
          shasum -a 256 Release/FluxaEngine.xcframework.zip | awk '{print $1}' > Release/checksum.txt
          shasum -a 256 Release/fluxa-test-fixture-macos-arm64.zip > Release/fixture-checksum.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          version = Path('Release.version').read_text().strip()
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version): raise SystemExit('版本格式无效')
          cargo_version = re.search(r'^version = "([^"]+)"', Path('Cargo.toml').read_text(), re.M).group(1)
          if version != cargo_version: raise SystemExit('发布版本与 Cargo 不一致')
          checksum = Path('Release/checksum.txt').read_text().strip()
          if not re.fullmatch(r'[0-9a-f]{64}', checksum): raise SystemExit('校验值无效')
          PYCODE
      - name: 保存原生版本标签
        run: |
          version="$(cat Release.version)"
          git tag "v$version"
          git push origin "v$version"
      - name: 发布下载附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat Release.version)"
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          version = Path('Release.version').read_text().strip()
          record = {'version': version, 'source_commit': os.environ['FLUXA_SOURCE_SHA'], 'tag': 'v'+version, 'tag_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'framework_sha256': Path('Release/checksum.txt').read_text().strip(), 'fixture_sha256': Path('Release/fixture-checksum.txt').read_text().split()[0]}
          Path('Release/provenance.json').write_text(json.dumps(record, indent=2)+'\n')
          Path('Release/release-notes.md').write_text('macOS ARM64 静态内核；Rust 检查结果见测试证据；Swift 适配与真实平台联调在 Fluxa 仓库单独验收。\n\n构建源码：'+record['source_commit']+'\n版本标签：'+record['tag']+'\n框架 SHA-256：'+record['framework_sha256']+'\n\n固定远程二进制，不包含 iOS/tvOS 切片；目标平台与未测范围见 Documentation/Protocols.md。\n')
          PYCODE
          gh release create "v$version" Release/FluxaEngine.xcframework.zip Release/checksum.txt Release/fluxa-test-fixture-macos-arm64.zip Release/fixture-checksum.txt Release/provenance.json --verify-tag --title "libfluxa_core v$version" --notes-file Release/release-notes.md
      - name: 验证原生二进制下载校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory="$(mktemp -d)"
          trap 'rm -rf "$directory"' EXIT
          gh release download "v$(cat Release.version)" --pattern FluxaEngine.xcframework.zip --dir "$directory"
          test "$(shasum -a 256 "$directory/FluxaEngine.xcframework.zip" | awk '{print $1}')" = "$(cat Release/checksum.txt)"

      - name: 保存真实测试报告与失败证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxa-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/*.md
            /tmp/fluxa-test-evidence/
          if-no-files-found: error
