[package]
name = "libfluxa_core"
version = "2.4.0"
authors = ["可莉唯一的狗"]
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Fluxa 跨平台自研网络内核、HTTP/HTTPS 调试、MITM 与受限 JS 引擎"
repository = "https://github.com/teaoea/Fluxa_Core"
homepage = "https://github.com/teaoea/Fluxa_Core"
readme = "README.md"
publish = ["crates-io"]
keywords = ["proxy", "https", "mitm", "ffi", "network"]
categories = ["network-programming"]
include = ["/src/**/*.rs", "/include/**", "/Tests/**/*.rs", "/Tests/fixtures/error-contract-v1.json", "/Tests/fixtures/error-contract-v2.json", "/tests/**/*.rs", "/examples/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/README_ENGLISH.md", "/fluxa.yaml", "/fluxa_english.yaml", "/rules.yaml", "/LICESE.md", "/Documentation/**", "/Notices/**"]

[lib]
name = "libfluxa_core"
crate-type = ["rlib", "staticlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
ml-kem = { version = "=0.3.2", features = ["zeroize"] }
ring = "=0.17.14"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "https-ring", "tls-ring", "dnssec-ring", "webpki-roots"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "x509-parser", "zeroize"] }
x509-parser = { version = "=0.18.1", features = ["verify"] }
time = "=0.3.55"
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision"] }
zeroize = "=1.9.0"
httparse = "=1.10.1"
url = "=2.5.8"
base64 = "=0.23.1"
rquickjs = { version = "=0.14.0", default-features = false }
yaml-rust2 = { version = "=0.13.0", default-features = false }
aho-corasick = "=1.1.4"
maxminddb = { version = "=0.32.0", default-features = false }

[[test]]
name = "https"
path = "Tests/https.rs"

[[test]]
name = "mitm"
path = "Tests/mitm.rs"

[[test]]
name = "script"
path = "Tests/script.rs"

[[test]]
name = "proxy"
path = "Tests/proxy.rs"

[[test]]
name = "dns"
path = "Tests/dns.rs"

[dev-dependencies]
h2 = "=0.4.20"
bytes = "=1.12.1"
http = "=1.4.2"

[[test]]
name = "dns_service"
path = "Tests/dns_service.rs"

[[test]]
name = "routing"
path = "Tests/routing.rs"

[[test]]
name = "outbound"
path = "Tests/outbound.rs"

[[test]]
name = "outbound_dns"
path = "Tests/outbound_dns.rs"

[[test]]
name = "outbound_fake_ip"
path = "Tests/outbound_fake_ip.rs"

[[test]]
name = "outbound_routing"
path = "Tests/outbound_routing.rs"

[[test]]
name = "outbound_resources"
path = "Tests/outbound_resources.rs"

[[test]]
name = "runtime_rules"
path = "Tests/runtime_rules.rs"

[[test]]
name = "subscription"
path = "Tests/subscription.rs"

[[test]]
name = "protocol"
path = "Tests/protocol.rs"

[[test]]
name = "geoip"
path = "Tests/geoip.rs"

[[test]]
name = "tun_udp"
path = "Tests/tun_udp.rs"

[[test]]
name = "protocol_block"
path = "Tests/protocol_block.rs"

[[test]]
name = "tun_dns"
path = "Tests/tun_dns.rs"

[[test]]
name = "error_contract"
path = "Tests/error_contract.rs"

[[test]]
name = "geoip_fixture"
path = "Tests/geoip_fixture.rs"

[[test]]
name = "service_pipeline"
path = "Tests/service_pipeline.rs"
