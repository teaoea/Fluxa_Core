[package]
autotests = false
name = "libfluxa_core"
version = "2.5.0"
authors = ["可莉唯一的狗"]
edition = "2024"
rust-version = "1.89"
license = "MIT"
homepage = "https://github.com/teaoea/Fluxa_Core"
readme = "README.md"
publish = ["crates-io"]
keywords = ["proxy", "https", "mitm", "ffi", "network"]
categories = ["network-programming"]
include = ["/src/**/*.rs", "/include/**", "/tests/**/*.rs", "/tests/fixtures/main-config-supported.yaml", "/tests/fixtures/error-contract-v1.json", "/tests/fixtures/error-contract-v2.json", "/tests/fixtures/error-contract-v2.4.1.json", "/tests/**/*.md", "/examples/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/README_ENGLISH.md", "/example_config.yaml", "/rules.yaml", "/LICESE.md", "/Documentation/**", "/AGENTS/**", "/Notices/**"]

[lib]
name = "libfluxa_core"
crate-type = ["rlib", "staticlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
ml-kem = { version = "=0.3.2", features = ["zeroize"] }
ring = "=0.17.14"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "https-ring", "tls-ring", "dnssec-ring", "webpki-roots"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "x509-parser", "zeroize"] }
x509-parser = { version = "=0.18.1", features = ["verify"] }
time = "=0.3.55"
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision"] }
zeroize = "=1.9.0"
httparse = "=1.10.1"
url = "=2.5.8"
base64 = "=0.23.1"
rquickjs = { version = "=0.14.0", default-features = false }
yaml-rust2 = { version = "=0.13.0", default-features = false }
aho-corasick = "=1.1.4"
# 固定公共后缀数据，关键词只匹配注册域名标签，查询不下载列表或创建堆索引。
psl = "=2.1.238"
maxminddb = { version = "=0.32.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# 复用已锁定的 Apple 安全框架与系统类型；仅平台边界需要 audit token 和签名验证。
security-framework = "=3.7.0"
core-foundation = "=0.10.1"
libproc = "=0.14.11"
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
h2 = "=0.4.20"
bytes = "=1.12.1"
http = "=1.4.2"

[[test]]
name = "test_dns"
path = "tests/test_dns.rs"

[[test]]
name = "test_error_contract"
path = "tests/test_error_contract.rs"

[[test]]
name = "test_fake_ip_lifecycle"
path = "tests/test_fake_ip_lifecycle.rs"

[[test]]
name = "test_mitm"
path = "tests/test_mitm.rs"

[[test]]
name = "test_outbound_dns"
path = "tests/test_outbound_dns.rs"

[[test]]
name = "test_outbound_fake_ip"
path = "tests/test_outbound_fake_ip.rs"

[[test]]
name = "test_outbound_routing"
path = "tests/test_outbound_routing.rs"

[[test]]
name = "test_protocol"
path = "tests/test_protocol.rs"

[[test]]
name = "test_protocol_block"
path = "tests/test_protocol_block.rs"

[[test]]
name = "test_proxy"
path = "tests/test_proxy.rs"

[[test]]
name = "test_runtime_rules"
path = "tests/test_runtime_rules.rs"

[[test]]
name = "test_service_pipeline"
path = "tests/test_service_pipeline.rs"

[[test]]
name = "test_tun_dns"
path = "tests/test_tun_dns.rs"

[[test]]
